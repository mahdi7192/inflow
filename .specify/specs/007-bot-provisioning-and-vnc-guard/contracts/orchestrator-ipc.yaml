# Server Orchestrator IPC & CLI Contract
# Defines the execution commands and JSON response formats for the server-side orchestrator script (scripts/hermes_orchestrator.py).

commands:
  provision:
    description: "Creates dedicated Hermes profile, writes config.yaml, deploys vnc_guard.py, and initializes virtual display."
    cli: "python3 scripts/hermes_orchestrator.py provision --account <account_username> --token <page_token> [--json]"
    output_schema:
      type: object
      properties:
        success: { type: boolean }
        account: { type: string }
        profile_name: { type: string }
        profile_dir: { type: string }
        display: { type: string }
        status: { type: string }
        vnc_url: { type: string }

  vnc_start:
    description: "Launches websockify with a one-time token and starts Chrome navigated to Instagram."
    cli: "python3 scripts/hermes_orchestrator.py vnc-start --account <account_username> [--url <target_url>] [--json]"
    output_schema:
      type: object
      properties:
        success: { type: boolean }
        account: { type: string }
        token: { type: string }
        vnc_url: { type: string }
        timeout_seconds: { type: integer }
        expires_at: { type: string }

  vnc_stop:
    description: "Kills the websockify process and removes the one-time token file."
    cli: "python3 scripts/hermes_orchestrator.py vnc-stop --account <account_username> [--json]"
    output_schema:
      type: object
      properties:
        success: { type: boolean }
        account: { type: string }
        message: { type: string }

  verify_session:
    description: "Inspects Chrome user data directory or Instagram session state to verify authentication."
    cli: "python3 scripts/hermes_orchestrator.py verify-session --account <account_username> [--json]"
    output_schema:
      type: object
      properties:
        success: { type: boolean }
        account: { type: string }
        authenticated: { type: boolean }
        status: { type: string }

  sync:
    description: "Executes isolated browser catalog scrape and syncs profile stats, posts, and completes pending jobs."
    cli: "python3 scripts/hermes_orchestrator.py sync --account <account_username> [--json]"
    output_schema:
      type: object
      properties:
        success: { type: boolean }
        account: { type: string }
        posts_synced: { type: integer }
        total_posts_reported: { type: integer }
        followers_text: { type: string }
        avatar_url: { type: string }
        status: { type: string }
