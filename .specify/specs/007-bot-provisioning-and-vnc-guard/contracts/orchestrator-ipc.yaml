# Server Orchestrator IPC & CLI Contract

This contract defines the execution commands and JSON response formats for the server-side orchestrator script (`scripts/hermes_orchestrator.py`).

---

## 1. CLI Commands

### 1.1 Provision Bot Profile
Creates the dedicated Hermes profile, writes `config.yaml`, deploys `vnc_guard.py`, and initializes the virtual display.

```bash
python3 scripts/hermes_orchestrator.py provision --account <account_username> --token <page_token> [--json]
```

**JSON Output Format**:
```json
{
  "success": true,
  "account": "r9spoort1",
  "profile_name": "inflow_r9spoort1",
  "profile_dir": "/root/.hermes/profiles/inflow_r9spoort1",
  "display": ":20",
  "status": "login_required",
  "vnc_url": "http://185.120.40.10:6080/vnc.html?autoconnect=true&resize=scale&path=websockify/?token=a1b2c3d4"
}
```

---

### 1.2 Start On-Demand VNC Guard Session
Launches websockify with a one-time token and starts Chrome navigated to Instagram.

```bash
python3 scripts/hermes_orchestrator.py vnc-start --account <account_username> [--url <target_url>] [--json]
```

**JSON Output Format**:
```json
{
  "success": true,
  "account": "r9spoort1",
  "token": "7f8a9b1c2d3e4f5a",
  "vnc_url": "http://185.120.40.10:6080/vnc.html?autoconnect=true&resize=scale&path=websockify/?token=7f8a9b1c2d3e4f5a",
  "timeout_seconds": 600,
  "expires_at": "2026-10-18T19:25:00Z"
}
```

---

### 1.3 Stop VNC Guard Session
Kills the websockify process and removes the one-time token file.

```bash
python3 scripts/hermes_orchestrator.py vnc-stop --account <account_username> [--json]
```

**JSON Output Format**:
```json
{
  "success": true,
  "account": "r9spoort1",
  "message": "VNC Guard session closed"
}
```

---

### 1.4 Check Session & Harvest Cookies
Inspects the Chrome user data directory or Instagram session state to verify if authentication succeeded.

```bash
python3 scripts/hermes_orchestrator.py verify-session --account <account_username> [--json]
```

**JSON Output Format**:
```json
{
  "success": true,
  "account": "r9spoort1",
  "authenticated": true,
  "session_id": "masked_session_id",
  "status": "live"
}
```
